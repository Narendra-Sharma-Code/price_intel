version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///instance/price_intel.db
      - USE_CACHED_DATA=true
      - SECRET_KEY=change-this-in-production
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

